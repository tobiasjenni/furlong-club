name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Seed plans and the admin account
        run: npm run db:seed
        env:
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build
      - name: Upload Worker secrets
        run: |
          node -e '
            const s = { DATABASE_URL: process.env.DATABASE_URL, AUTH_SECRET: process.env.AUTH_SECRET, CRON_SECRET: process.env.CRON_SECRET,
                        RESEND_API_KEY: process.env.RESEND_API_KEY, NOWPAYMENTS_API_KEY: process.env.NOWPAYMENTS_API_KEY,
                        NOWPAYMENTS_IPN_SECRET: process.env.NOWPAYMENTS_IPN_SECRET, BUNNY_TOKEN_KEY: process.env.BUNNY_TOKEN_KEY };
            for (const k of Object.keys(s)) if (!s[k]) delete s[k];
            require("fs").writeFileSync("/tmp/secrets.json", JSON.stringify(s));'
          npx wrangler secret bulk /tmp/secrets.json
          rm /tmp/secrets.json
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
          NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
          BUNNY_TOKEN_KEY: ${{ secrets.BUNNY_TOKEN_KEY }}
      - name: Deploy
        run: npx opennextjs-cloudflare deploy
