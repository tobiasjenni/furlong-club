name: Deploy wallet test site
on:
  push:
    branches: [feat/stablecoin-wallet-ledger, feat/manual-deposit-review, feat/harry-trading-lock, feat/site-wording-33-days, feat/smooth-secure-signup, feat/highlight-harry-membership, feat/search-appearance-seo, feat/furlong-v2-portal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wallet-test-deploy
  cancel-in-progress: false
jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: staging
      CLUB_GATE_ENABLED: 'true'
      WALLET_TEST_CLUB_PASSWORD_HASH: ${{ secrets.WALLET_TEST_CLUB_PASSWORD_HASH }}
      ENABLE_TEST_PAYMENTS: 'true'
      PAYMENT_PROVIDER: mock
      WALLET_ENABLED: 'true'
      WALLET_TEST_DATABASE_URL: ${{ secrets.WALLET_TEST_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare isolated test deployment
        run: node scripts/prepare-wallet-test-deploy.mjs
      - name: Apply test database migrations
        run: npx prisma migrate deploy
      - name: Seed test plans
        run: npm run db:seed
      - name: Seed verified test accounts
        run: npx tsx scripts/seed-wallet-test.ts
        env:
          WALLET_TEST_MEMBER_PASSWORD: ${{ secrets.WALLET_TEST_MEMBER_PASSWORD }}
          WALLET_TEST_ADMIN_PASSWORD: ${{ secrets.WALLET_TEST_ADMIN_PASSWORD }}
      - run: npm test
      - name: Build test Worker
        run: npx opennextjs-cloudflare build --config wrangler.test.generated.json
      - name: Deploy test Worker
        run: npx wrangler deploy --config wrangler.test.generated.json --secrets-file "$RUNNER_TEMP/wallet-test-secrets.json"
      - name: Verify test site is responding
        run: |
          curl --fail --retry-all-errors --retry 6 --retry-delay 5 --max-time 20 "$APP_URL/login" --output /dev/null
          node scripts/check-club-gate.mjs
      - name: Remove temporary secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/wallet-test-secrets.json"
