name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: horse
          POSTGRES_PASSWORD: horse
          POSTGRES_DB: furlong
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U horse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://horse:horse@localhost:5432/furlong?schema=public
      AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npm run build
