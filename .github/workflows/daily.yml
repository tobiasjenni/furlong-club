name: Daily jobs

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APP_URL: https://furlong.club
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Renewal reminders and clean-up
        run: npm run daily
