name: Owner-requested Darrel deposit correction
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, apply]
        default: inspect
      expected_user_id:
        type: string
        default: ''
      expected_payment_id:
        type: string
        default: ''
      expected_balance_cents:
        type: string
        default: ''
      expected_updated_at:
        type: string
        default: ''
permissions:
  contents: read
concurrency: darrel-deposit-correction
jobs:
  correction:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/lookup-deposit-correction.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORRECTION_OPERATION: ${{ inputs.operation }}
          EXPECTED_USER_ID: ${{ inputs.expected_user_id }}
          EXPECTED_PAYMENT_ID: ${{ inputs.expected_payment_id }}
          EXPECTED_BALANCE_CENTS: ${{ inputs.expected_balance_cents }}
          EXPECTED_UPDATED_AT: ${{ inputs.expected_updated_at }}
          CORRECTION_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
